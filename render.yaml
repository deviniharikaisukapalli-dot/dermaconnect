services:
  - type: web
    name: dermaconnect-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DEMO_AUTH_REQUIRED
        value: "true"
      - key: DEMO_USERNAME
        value: demo
      - key: DEMO_PASSWORD
        sync: false